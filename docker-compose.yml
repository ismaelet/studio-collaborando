services:
    laravel:
        container_name: ${APP_SLUG}-laravel
        build:
            context: .
            dockerfile: ./Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - '8000:8000'
        command: php artisan serve --host=0.0.0.0 --port=8000
        networks:
            - internal
    mysql:
        image: 'mysql:latest'
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql:/var/lib/mysql'
        networks:
            - internal
    phpmyadmin:
        image: phpmyadmin
        ports:
            - 8080:80
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            UPLOAD_LIMIT: 100000000
        networks:
            - internal
        depends_on:
            - mysql
networks:
    internal:
        driver: bridge
volumes:
    mysql:
        driver: local
