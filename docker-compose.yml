services:
    laravel-php:
        build:
            context: .
            dockerfile: ./_docker/Dockerfile
        volumes:
            - ".:/var/www/html"
        ports:
            - "80:80"
        depends_on:
            - mysql
        networks:
            - internal
    mysql:
        image: "mysql:latest"
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ""
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: "project_database"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - "mysql:/var/lib/mysql"
        networks:
            - internal
        restart: unless-stopped
    phpmyadmin:
        image: phpmyadmin
        ports:
            - 8080:80
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: ""
            UPLOAD_LIMIT: 100000000
        networks:
            - internal
        depends_on:
            - mysql
        restart: unless-stopped
networks:
    internal:
        driver: bridge
volumes:
    mysql:
        driver: local
